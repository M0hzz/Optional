# optlab with Docker Compose: an alternative to the systemd install (docs/DEPLOY.md).
#
#   cp .env.example .env            # optional: ports, user id
#   docker compose up -d --build
#   open http://127.0.0.1:8600      # dashboard;  Research Lab: http://127.0.0.1:8518
#
# Both services publish on 127.0.0.1 only. The project's data/ folder is bind-mounted, so there is ONE
# SQLite database (data/optlab.sqlite) shared with the host install. Run the API from systemd OR from
# Docker, not both: a second API on the same database refuses to start (single-instance lock).
name: optlab

x-common: &common
  build:
    context: .
    args:
      OPTLAB_PYTHON_IMAGE: ${OPTLAB_PYTHON_IMAGE:-python:3.13-slim-bookworm}
      OPTLAB_NODE_IMAGE: ${OPTLAB_NODE_IMAGE:-node:22-bookworm-slim}
  image: optlab:local
  user: "${OPTLAB_UID:-1000}:${OPTLAB_GID:-1000}"
  restart: unless-stopped
  volumes:
    - ./data:/app/data
    - ./config.yaml:/app/config.yaml:ro
    - ./scans.yaml:/app/scans.yaml:ro

services:
  api:
    <<: *common
    command: ["python", "-m", "optlab.api"]
    environment:
      OPTLAB_API_HOST: 0.0.0.0                   # inside the container network only; published on 127.0.0.1 below
      OPTLAB_API_PORT: "8600"
      OPTLAB_DB_URL: sqlite:////app/data/optlab.sqlite
      OPTLAB_RESEARCH_URL: ${OPTLAB_RESEARCH_URL:-http://127.0.0.1:8518/}
      OPTLAB_CORS_ORIGINS: http://127.0.0.1:${OPTLAB_API_PORT:-8600},http://localhost:${OPTLAB_API_PORT:-8600}
      OPTLAB_QUOTE_SOURCE: ${OPTLAB_QUOTE_SOURCE:-}
      OPTLAB_MONITOR: ${OPTLAB_MONITOR:-on}      # the portfolio monitor runs inside the API (one per database)
    ports:
      - "127.0.0.1:${OPTLAB_API_PORT:-8600}:8600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8600/api/v1/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  research:
    <<: *common
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports:
      - "127.0.0.1:${OPTLAB_RESEARCH_PORT:-8518}:8501"   # 8518, so it never clashes with the systemd Streamlit on 8517
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
