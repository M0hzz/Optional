# Momentum breakout: a short-term uptrend that clears VWAP on heavy volume.
historical_signal_search:
  name: Momentum breakout
  description: 5-minute bars where the fast EMA is above the slow EMA, price is above VWAP, volume is heavy and RSI shows momentum.
  symbols: [NVDA]
  timeframe: 5m
  range:
    start: 2026-08-20
    end: 2026-10-16
    timezone: America/New_York
    market_hours_only: true
  conditions:
    - id: ema_trend
      expression: ema(9) > ema(21)
      required: true
      weight: 25
      tolerance: {type: percent_distance, value: 0.20}
    - id: above_vwap
      expression: close > vwap()
      required: true
      weight: 25
      tolerance: {type: percent_distance, value: 0.20}
    - id: volume
      expression: rel_volume(20) >= 1.5
      required: false
      weight: 30
      tolerance: {type: absolute, value: 0.20}
    - id: momentum
      expression: rsi(14) >= 55
      required: false
      weight: 20
      tolerance: {type: absolute, value: 5}
  matching:
    minimum_score: 75
    minimum_pass_count: 3
    include_exact: true
    include_near: true
  output: {sort_by: timestamp, order: ascending, limit: 1000}
  forward: {horizons: ["1", "3", "5", "10", "1d"], dedupe_bars: 6}
