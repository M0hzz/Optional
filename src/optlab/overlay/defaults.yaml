# Built-in overlay settings. Do not edit this file: put changes in overlay.yaml at the project
# root (the dashboard's Overlay tab writes there). Anything you set there overrides the value
# here; a `rules:` list there replaces this list entirely.
#
# Everything below is a transparent rule or threshold. No AI, machine learning or language
# model is used anywhere in the overlay: the same data and settings always give the same output.
overlay:
  enabled: true
  completed_bars_only: true     # ignore the bar that is still forming
  compact: false                # console shows one line per highlight instead of cards
  console_items: 8              # highlights listed in the console
  tabs:                         # per-tab overlay panels
    scanner: true
    chain_pricer: true
    strategy_lab: true
    backtest: true
    risk: true
    insiders: true
    company: true
    macro: true
    option_chain: true
    monitor: true
    signal_explorer: true
  labels: {}                    # rename display labels, e.g. {NEAR_CONFIRMATION: "Almost"}

  account_profile:              # Small Account Mode (on by default)
    small_account_mode: true
    account_type: cash
    total_buying_power: 1000
    settled_cash: 1000
    reserve_cash: 300
    max_capital_per_idea: 300
    max_loss_per_idea: 100
    max_account_risk_pct: 10
    max_contracts: 1
    defined_risk_only: true
    naked_options_allowed: false
    unlimited_risk_allowed: false
    require_assignment_capacity: true
    contract_multiplier: 100
    owned_shares: {}            # e.g. {AAPL: 100} so covered calls don't charge for shares you hold

  thresholds:
    watch_score: 50
    near_match_score: 75
    confirmed_match_score: 100
    stale_after_bars: 5
    overextended_atr_multiple: 2.0
    minimum_historical_samples: 30
    maximum_bid_ask_pct: 15
    minimum_open_interest: 100
    minimum_option_volume: 10
    maximum_quote_age_seconds: 60
    stale_data_sessions: 3       # daily bars older than this many sessions are stale
    breadth_minimum_symbols: 20  # breadth from fewer symbols carries a low-sample warning
    high_theta_pct: 5            # |theta| per day above this % of the premium is flagged
    far_otm_delta: 0.10          # |delta| below this on a long option is flagged as far OTM
    expiration_warning_days: 2
    compression_percentile: 20
    expansion_percentile: 60
    pin_risk_pct: 1.0            # short strike within this % of price near expiry = pin risk
    outlier_share: 0.5           # top-2 trades contributing more than this share of P&L = outlier dependent
    parameter_sensitivity_drop: 0.5

  market:
    indexes: [SPY, QQQ, IWM, DIA]
    benchmark: SPY
    breadth_ma: 50
    breadth_bullish_pct: 60
    breadth_bearish_pct: 40
    new_high_bars: 252
    divergence_bars: 20
    sector_etfs: {XLK: Technology, XLF: Financials, XLY: Consumer discretionary, XLV: Health care,
                  XLE: Energy, XLI: Industrials, XLP: Consumer staples, XLU: Utilities, XLB: Materials,
                  XLRE: Real estate, XLC: Communication}
    symbol_sectors: {AAPL: XLK, MSFT: XLK, NVDA: XLK, AMZN: XLY, JPM: XLF, GOOGL: XLC, META: XLC,
                     TSLA: XLY, AVGO: XLK}

  similarity:                   # nearest historical analogues
    top: 10
    features:                   # value at the bar, compared with |a - b| / scale
      rsi(14): {scale: 10, weight: 1}
      rel_volume(20): {scale: 0.5, weight: 1}
      distance_pct(close, sma(50)): {scale: 3, weight: 1}
      atr_pct(14): {scale: 1, weight: 1}
      rs(20): {scale: 3, weight: 1}

  confluence:
    show_composite: false       # the optional composite score; components are always shown
    weights: {market: 15, sector: 10, technical: 35, historical: 20, liquidity: 10, data_quality: 10}

  alerts:
    cooldown_minutes: 30        # the same rule/symbol/status won't alert again inside this window
    stacking_bars: 3            # rules from different groups confirming within N bars = signal stacking
    desktop: true

  rules:
    - id: bullish_continuation
      name: Bullish continuation
      direction: bullish
      group: trend_up
      tab_scope: [scanner, macro, monitor]
      conditions:
        - {id: above_vwap, expression: "close > rolling_vwap(20)", required: true, weight: 20,
           tolerance: {type: percent_distance, value: 0.5}}
        - {id: ema_stack, expression: "ema(9) > ema(21)", required: true, weight: 20,
           tolerance: {type: percent_distance, value: 0.2}}
        - {id: volume, expression: "rel_volume(20) >= 1.5", required: false, weight: 25,
           tolerance: {type: absolute, value: 0.2}}
        - {id: momentum, expression: "rsi(14) >= 55", required: false, weight: 15,
           tolerance: {type: absolute, value: 5}}
        - {id: relative_strength, expression: "rs(20) > 0", required: false, weight: 20,
           tolerance: {type: absolute, value: 1}}
      confirmation: {minimum_score: 85, minimum_pass_count: 4, required_conditions_must_pass: true}
      invalidation: ["close < ema(21)"]

    - id: bearish_rejection
      name: Bearish rejection
      direction: bearish
      group: trend_down
      tab_scope: [scanner, macro, monitor]
      conditions:
        - {id: below_vwap, expression: "close < rolling_vwap(20)", required: true, weight: 25,
           tolerance: {type: percent_distance, value: 0.5}}
        - {id: ema_stack, expression: "ema(9) < ema(21)", required: true, weight: 20,
           tolerance: {type: percent_distance, value: 0.2}}
        - {id: rejected, expression: "high >= ago(highest(10), 1) * 0.99 and close < open", required: false, weight: 20}
        - {id: selling_volume, expression: "rel_volume(20) >= 1.3", required: false, weight: 15,
           tolerance: {type: absolute, value: 0.2}}
        - {id: weak_rs, expression: "rs(20) < 0", required: false, weight: 20, tolerance: {type: absolute, value: 1}}
      confirmation: {minimum_score: 80, minimum_pass_count: 3, required_conditions_must_pass: true}
      invalidation: ["close > ema(21)"]

    - id: trend_pullback
      name: Trend pullback
      direction: bullish
      group: trend_up
      tab_scope: [scanner, monitor]
      conditions:
        - {id: uptrend, expression: "close > sma(50)", required: true, weight: 20}
        - {id: trend_stack, expression: "sma(50) > sma(200)", required: true, weight: 20}
        - {id: at_support, expression: "distance_pct(low, ema(21)) <= 1.0", required: true, weight: 20,
           tolerance: {type: absolute, value: 1.0}}
        - {id: volume_contracts, expression: "avg_volume(5) < avg_volume(20)", required: false, weight: 15}
        - {id: rejection_bar, expression: "close > open and close > ema(21)", required: false, weight: 15}
        - {id: momentum_turn, expression: "macd_hist() > ago(macd_hist(), 1)", required: false, weight: 10}
      confirmation: {minimum_score: 85, minimum_pass_count: 5, required_conditions_must_pass: true}
      invalidation: ["close < sma(50)"]

    - id: confirmed_breakout
      name: Confirmed breakout
      direction: bullish
      group: breakout_up
      tab_scope: [scanner, monitor]
      conditions:
        - {id: closed_above, expression: "close > ago(highest(20), 1)", required: true, weight: 25,
           tolerance: {type: percent_distance, value: 0.5}}
        - {id: clearance, expression: "distance_pct(close, ago(highest(20), 1)) >= 0.25", required: false, weight: 15,
           tolerance: {type: absolute, value: 0.25}}
        - {id: volume, expression: "rel_volume(20) >= 1.5", required: true, weight: 25,
           tolerance: {type: absolute, value: 0.2}}
        - {id: market_agrees, expression: "rs(20) > 0", required: false, weight: 15, tolerance: {type: absolute, value: 1}}
        - {id: not_extended, expression: "distance_pct(close, rolling_vwap(20)) <= 6", required: false, weight: 20,
           tolerance: {type: absolute, value: 1}}
      confirmation: {minimum_score: 85, minimum_pass_count: 4, required_conditions_must_pass: true}
      invalidation: ["close < ago(highest(20), 1)"]

    - id: failed_breakout
      name: Failed breakout
      direction: bearish
      group: breakout_down
      tab_scope: [scanner, monitor]
      conditions:
        - {id: traded_above, expression: "high > ago(highest(20), 1)", required: true, weight: 30}
        - {id: closed_inside, expression: "close <= ago(highest(20), 1)", required: true, weight: 30}
        - {id: rejection_volume, expression: "rel_volume(20) >= 1.2", required: false, weight: 20,
           tolerance: {type: absolute, value: 0.2}}
        - {id: lost_vwap, expression: "close < rolling_vwap(20)", required: false, weight: 20}
      confirmation: {minimum_score: 80, minimum_pass_count: 3, required_conditions_must_pass: true}

    - id: relative_strength_divergence
      name: Relative-strength divergence
      direction: bullish
      group: relative_strength
      tab_scope: [scanner]
      conditions:
        - {id: benchmark_weak, expression: "change_pct(10, bench_close) <= 0", required: true, weight: 25}
        - {id: holds_support, expression: "close > ago(lowest(20), 1)", required: true, weight: 25}
        - {id: above_vwap, expression: "close > rolling_vwap(20)", required: false, weight: 25}
        - {id: rs_rising, expression: "increasing(rs_line, 5)", required: false, weight: 25}
      confirmation: {minimum_score: 75, minimum_pass_count: 3, required_conditions_must_pass: true}

    - id: compression
      name: Compression (nondirectional)
      direction: neutral
      group: volatility
      tab_scope: [scanner, macro]
      conditions:
        - {id: narrow_bands, expression: "pct_rank(bb_width(20), 120) <= 20", required: true, weight: 30,
           tolerance: {type: absolute, value: 10}}
        - {id: low_atr, expression: "pct_rank(atr(14), 120) <= 20", required: false, weight: 25,
           tolerance: {type: absolute, value: 10}}
        - {id: tight_range, expression: "pct_rank(highest(10) - lowest(10), 120) <= 25", required: false, weight: 25,
           tolerance: {type: absolute, value: 10}}
        - {id: quiet_volume, expression: "avg_volume(5) < avg_volume(50)", required: false, weight: 20}
      confirmation: {minimum_score: 75, minimum_pass_count: 3, required_conditions_must_pass: true}

    - id: compression_exit
      name: Compression to expansion
      direction: neutral
      group: volatility
      kind: volatility
      tab_scope: [scanner, macro, monitor]
      conditions:
        - {id: was_compressed, expression: "ago(pct_rank(bb_width(20), 120), 5) <= 25", required: true, weight: 25}
        - {id: expanding, expression: "pct_rank(bb_width(20), 120) >= 60", required: true, weight: 25,
           tolerance: {type: absolute, value: 10}}
        - {id: volume, expression: "rel_volume(20) >= 1.3", required: false, weight: 25,
           tolerance: {type: absolute, value: 0.2}}
        - {id: range_exit, expression: "close > ago(highest(20), 1) or close < ago(lowest(20), 1)", required: false, weight: 25}
      confirmation: {minimum_score: 75, minimum_pass_count: 3, required_conditions_must_pass: true}
