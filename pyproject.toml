[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optlab"
version = "0.1.0"
description = "Personal options-strategy research lab: data, filings, pricing, backtests, risk and a dashboard."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pyyaml",
  "QuantLib",
  "duckdb",
  "polars",
  "pyarrow",
  "vectorbt",
  "skfolio",
  "streamlit",
  "altair",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "requests",
]

[project.optional-dependencies]
data = ["openbb>=4.5,<5", "openbb-yfinance", "openbb-cboe>=1.4,<2", "edgartools"]
research = ["pyqlib", "lightgbm"]
live = ["nautilus_trader"]
dev = ["pytest", "httpx", "mypy", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
