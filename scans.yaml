# optlab live monitor: what to scan, when, and which open positions to watch.
# Run it with:   python scripts/monitor.py
# Test one pass: python scripts/monitor.py --once
# Conditions are checked every `every_seconds` between `start` and `end`.
# A desktop notification fires when a symbol newly passes a scan or a position's
# status changes (HOLD -> WATCH -> EXIT). Nothing is ever traded.

# The most one trade may cost or risk, in dollars. Option scans then list only what fits:
# one contract (or one spread) costing this much or less, and how many fit. Anything from
# about 80 up works. Delete the line for no limit.
trade_size: 250

schedule:
  start: "09:30"             # when checks begin (quote the times)
  end: "16:00"               # when they stop for the day
  timezone: America/New_York # times above are in this zone
  days: [mon, tue, wed, thu, fri]
  every_seconds: 60          # how often to scan

data:
  source: live               # live (OpenBB: CBOE chains, Yahoo bars) | synthetic (offline test data)
  chain_source: cboe         # cboe: full chain + Greeks, one request, 15-min delayed | yfinance
  chain_refresh_seconds: 50  # refetch chains this often (CBOE data is 15 min delayed either way)

alerts:
  desktop: true
  repeat_exit_minutes: 15    # re-alert an EXIT this often while it stays true (0 = once)
  rearm_minutes: 30          # a scan hit alerts again only after being out of the scan this long
  confirm_passes: 3          # a position's new status must hold this many passes before alerting

# Lists of symbols. Use them in scans with `watchlist: name` (or a list of names).
# A list can also live in a file, one symbol per line:  big: file:watchlists/liquid_options.txt
watchlists:
  core: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, JPM]
  megacaps: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO]
  liquid: file:watchlists/liquid_options.txt

# ---------------------------------------------------------------- scans
# Each scan:
#   watchlist / symbols   which securities to check
#   timeframe             bars the studies run on: 1m 5m 15m 30m 1h 1d 1wk
#   stock                 conditions on the security; ALL must be true
#   options               optional: which contracts in its chain qualify
#
# Studies: sma(n) ema(n) rsi(n) macd() macd_signal() macd_hist() atr(n) atr_pct(n)
#   adx(n) plus_di(n) minus_di(n) bb_upper(n,k) bb_mid bb_lower bb_width bb_pct
#   stoch_k(n) stoch_d(n) williams_r(n) cci(n) obv() vwap() hv(n) highest(n) lowest(n)
#   change_pct(n) distance_pct(a,b) avg_volume(n) rel_volume(n) ago(x,n)
#   crosses_above(a,b) crosses_below(a,b); bars: open high low close volume
#   Any study takes s=... to run on another series, e.g. sma(20, s=volume).
# From the chain: atm_iv (~30-day ATM implied vol), skew (25-delta put IV - call IV),
#   put_call_volume, put_call_oi, option_volume.   Also: days_to_earnings.
# Combine with and / or / not, compare with < <= > >= == !=, do math with + - * /.
#
# Option contract fields (for options.conditions and sort):
#   strike dte type bid ask mid last volume open_interest (oi) iv delta abs_delta gamma
#   theta vega spread_pct otm_pct moneyness intrinsic extrinsic breakeven
#   yield_pct annualized_yield prob_otm   (+ every study/name above, at its latest value)
#
# What one trade costs (options.side says what the scan does with the contract):
#   side: buy                 buy the option                capital = ask x 100
#   side: buy  + max_width    debit spread: also sell one further out of the money
#   side: sell                cash-secured put / covered call: capital = the shares, 100 x the price
#   side: sell + max_width    credit spread: also buy one further out of the money;
#                             capital = the most it can lose = (width - credit) x 100
#   max_width is in dollars between the two strikes. The widest spread that fits trade_size is used.
# This adds the fields: capital max_loss net (per share: + paid, - received) return_on_risk
#   contracts (how many fit trade_size) other_strike. Prices are natural: buy at ask, sell at bid.
scans:
  - name: Put credit spreads
    watchlist: core
    timeframe: 1d
    stock:
      - close > sma(200)              # long-term uptrend
      - rsi(14) < 50                  # not stretched
      - days_to_earnings > 45         # no earnings before a ~35-45 day expiry
    options:
      type: put                       # put | call | both
      side: sell                      # buy | sell
      max_width: 5                    # spread: buy a put up to $5 below the one sold
      dte: [25, 50]                   # days to expiration, min-max
      delta: [0.15, 0.30]             # absolute delta of the put sold, min-max
      min_open_interest: 100
      max_spread_pct: 15              # (ask - bid) / mid, %
      conditions:
        - iv > hv(20)                 # implied vol above realized
        - return_on_risk >= 15        # credit is at least 15% of the most it can lose
      sort: return_on_risk            # best first; add " asc" for smallest first
      top: 3                          # contracts listed per symbol

  - name: Calls to buy on a pullback
    watchlist: core
    timeframe: 1d
    stock:
      - close > sma(50)               # uptrend
      - rsi(14) < 45                  # pulled back
      - days_to_earnings > 30
    options:
      type: call
      side: buy
      dte: [30, 60]
      delta: [0.30, 0.50]
      min_open_interest: 100
      max_spread_pct: 15
      sort: capital asc               # cheapest first
      top: 3

  - name: Implied vol rich vs realized
    watchlist: [core, megacaps]
    timeframe: 1d
    stock:
      - atm_iv > hv(20) * 1.3
      - atm_iv > 0.20

  - name: Intraday momentum (5m)
    watchlist: megacaps
    timeframe: 5m
    stock:
      - crosses_above(ema(9), ema(21))
      - close > vwap()
      - rel_volume(20) > 1.2

  - name: 1-minute RSI oversold bounce
    watchlist: core
    timeframe: 1m
    stock:
      - crosses_above(rsi(14), 30)
      - change_pct(30) < -1           # only after a real drop: down over 1% in 30 minutes

# ------------------------------------------------------------ positions
# Open trades to check every pass. Status: EXIT if any exit_when is true, else
# WATCH if any watch_when is true, else HOLD. Leave exit_when / watch_when out
# to use position_defaults.
# Position fields: pnl pnl_pct value entry (+ debit paid, - credit received) max_loss
#   loss_pct_of_max dte short_strike_otm_pct position_delta theta_day days_to_earnings
#   earnings_before_expiry  (+ every study/chain name above)
# The defaults work at any size, from a single $80 option up: percentages, not dollar
# amounts, and `entry` tells bought trades (entry > 0) from sold ones (entry < 0).
position_defaults:
  exit_when:
    - pnl_pct >= 50                   # up half of what you paid, or kept half the credit
    - loss_pct_of_max >= 50           # lost half of the most this trade can lose
    - entry < 0 and pnl_pct <= -200   # sold premium: loss is 2x the credit
    - entry < 0 and dte <= 21         # sold premium: gamma risk rises near expiry
  watch_when:
    - short_strike_otm_pct < 3        # price within 3% of a short strike
    - earnings_before_expiry
    - entry > 0 and dte <= 7          # bought options: time decay speeds up
    - rsi(14) < 30

positions: []
# Example (qty negative = sold, price = your fill per share):
#   - name: AAPL Nov 300 short put
#     symbol: AAPL
#     legs:
#       - {type: put, strike: 300, expiration: 2026-11-20, qty: -1, price: 3.10}
#   - name: SPY put credit spread
#     symbol: SPY
#     legs:
#       - {type: put, strike: 640, expiration: 2026-11-20, qty: -1, price: 6.40}
#       - {type: put, strike: 620, expiration: 2026-11-20, qty: 1, price: 3.90}
#     exit_when: [pnl_pct >= 60, close < 645]
#   - name: Covered call
#     symbol: MSFT
#     legs:
#       - {type: stock, qty: 100, price: 480}
#       - {type: call, strike: 540, expiration: 2026-12-18, qty: -1, price: 7.20}
