# optlab configuration. Every script and the dashboard read this file.

data:
  db_path: data/market.duckdb
  # "openbb" pulls real data (needs `pip install openbb` and internet).
  # "synthetic" generates realistic fake data so everything runs offline.
  source: synthetic
  openbb_provider: yfinance        # free; swap for polygon, intrinio, cboe, tradier...
  history_start: "2018-01-01"

universe: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, JPM]

market:
  risk_free_rate: 0.04             # fallback when the macro table has no Treasury yield yet
  rate_series: treasury_3m         # macro series used as the risk-free rate in pricing
  dividend_yield: 0.0

edgar:
  # The SEC requires a name + email on every request.
  identity: "Your Name your.email@example.com"
  lookback_days: 180               # Form 4 insider trades
  filings_lookback_days: 365       # 8-K / 10-Q / 10-K filings

news:
  # Phase 5: news and official events, a confirmation and risk-awareness layer (never a trade signal).
  # Fetched by the API every interval (OPTLAB_NEWS=off switches it off). SEC EDGAR needs edgar.identity above.
  enabled: true
  interval_minutes: 15
  symbols: []                      # extra symbols to follow (positions, plans, watched contracts and the
                                   # universe above are always followed)
  sec:
    lookback_days: 14              # filings per followed company (the latest 5 of each form)
    submissions_every_minutes: 60
  bls:
    feeds: [cpi, empsit, ppi, jolts, eci, realer, prod2, ximpim]
  company_ir: {}                   # SYMBOL: RSS/Atom URL of the company's investor-relations news feed
  # disabled_sources: [bea]
  # credibility: {sec_edgar: 0.95, federal_reserve: 0.95, bls: 0.95, bea: 0.95, company_ir: 0.85, finnhub: 0.7}
  # Finnhub is optional: set FINNHUB_API_KEY in the environment (never in this file) to enable it.
  # lexicon_path: data/lexicon/Loughran-McDonald_MasterDictionary_1993-2025.csv

account:
  equity: 100000
  max_risk_per_trade_pct: 2.0      # max loss of a single position, % of equity
  max_underlying_pct: 25.0         # max capital tied to one underlying
  max_portfolio_delta_pct: 50.0    # |dollar delta| as % of equity
  max_portfolio_vega_pct: 1.0      # $ change per 1 vol-point, % of equity
  max_drawdown_pct: 20.0

strategy_defaults:
  dte: 35
  short_delta: 0.25
  spread_width_pct: 5.0            # wing width as % of spot
  profit_take_pct: 50.0            # close at 50% of max profit
  slippage_pct_of_premium: 3.0     # haircut on every fill in quick backtests
  commission_per_contract: 0.65
